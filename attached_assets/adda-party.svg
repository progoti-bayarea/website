<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0533"/>
      <stop offset="100%" style="stop-color:#3b0f6e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="40%" r="40%">
      <stop offset="0%" style="stop-color:#e040fb;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="60%" r="35%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#glow1)"/>
  <rect width="600" height="400" fill="url(#glow2)"/>

  <!-- Confetti dots -->
  <circle cx="80" cy="60" r="5" fill="#f472b6" opacity="0.9"/>
  <circle cx="140" cy="30" r="3" fill="#facc15" opacity="0.8"/>
  <circle cx="200" cy="80" r="4" fill="#34d399" opacity="0.7"/>
  <circle cx="300" cy="20" r="6" fill="#f472b6" opacity="0.6"/>
  <circle cx="380" cy="50" r="4" fill="#60a5fa" opacity="0.8"/>
  <circle cx="460" cy="35" r="3" fill="#facc15" opacity="0.9"/>
  <circle cx="530" cy="70" r="5" fill="#e040fb" opacity="0.7"/>
  <circle cx="50" cy="130" r="4" fill="#60a5fa" opacity="0.6"/>
  <circle cx="560" cy="150" r="3" fill="#34d399" opacity="0.8"/>
  <circle cx="520" cy="300" r="4" fill="#f472b6" opacity="0.7"/>
  <circle cx="40" cy="320" r="5" fill="#facc15" opacity="0.6"/>
  <circle cx="100" cy="370" r="3" fill="#60a5fa" opacity="0.8"/>
  <circle cx="500" cy="380" r="4" fill="#e040fb" opacity="0.7"/>

  <!-- Confetti rectangles -->
  <rect x="110" y="55" width="8" height="4" rx="1" fill="#facc15" opacity="0.8" transform="rotate(30 114 57)"/>
  <rect x="430" y="80" width="10" height="4" rx="1" fill="#34d399" opacity="0.7" transform="rotate(-20 435 82)"/>
  <rect x="250" y="45" width="8" height="3" rx="1" fill="#60a5fa" opacity="0.8" transform="rotate(15 254 46)"/>
  <rect x="550" cy="220" width="7" height="3" rx="1" fill="#f472b6" opacity="0.8" transform="rotate(-40 553 222)"/>

  <!-- Stars / sparkles -->
  <text x="70" y="200" font-size="18" fill="#facc15" opacity="0.8">✦</text>
  <text x="490" y="120" font-size="14" fill="#f472b6" opacity="0.7">✦</text>
  <text x="160" y="340" font-size="12" fill="#60a5fa" opacity="0.6">✦</text>
  <text x="540" y="340" font-size="16" fill="#34d399" opacity="0.7">✦</text>
  <text x="320" y="370" font-size="10" fill="#facc15" opacity="0.6">✦</text>

  <!-- Main text: ADDA -->
  <text x="300" y="210" font-family="Georgia, serif" font-size="108" font-weight="bold"
        text-anchor="middle" fill="white" opacity="0.97" letter-spacing="8">ADDA</text>

  <!-- Subtitle -->
  <text x="300" y="255" font-family="Georgia, serif" font-size="18"
        text-anchor="middle" fill="#d8b4fe" opacity="0.9" letter-spacing="3">Community Social &amp; Game Night</text>

  <!-- Bottom date hint line -->
  <text x="300" y="310" font-family="sans-serif" font-size="13"
        text-anchor="middle" fill="#a78bfa" opacity="0.7" letter-spacing="2">AUGUST 1, 2026  •  PALO ALTO</text>
</svg>
